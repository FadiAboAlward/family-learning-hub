<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>الكويز التكيفي الممتع</title>
<style>
body{margin:0;background:#f7f4f8;color:#261f29;font-family:Tahoma,Arial,sans-serif;line-height:1.65}.w{max-width:760px;margin:auto;padding:12px}.hero,.card,.report{background:#fff;border:1px solid #eadfeb;border-radius:22px;padding:18px;box-shadow:0 12px 32px #45284c12}.hero{background:linear-gradient(135deg,#4d2e54,#79527f);color:#fff}.hero h1{margin:0 0 5px;font-size:1.4rem}.hero p{margin:0}.top{display:flex;gap:10px;align-items:center;margin:12px 0 8px}.bar{height:10px;background:#e8dfe9;flex:1;border-radius:30px;overflow:hidden}.bar b{display:block;height:100%;background:#6d3c73;width:0}.chip{background:#fff;border:1px solid #eadfeb;border-radius:12px;padding:5px 8px;font-size:.85rem}.meta{display:flex;justify-content:space-between;color:#736978;font-size:.86rem;margin-bottom:8px}.tag{display:inline-block;background:#f0e8f2;color:#5e3a64;padding:4px 8px;border-radius:20px;font-size:.78rem}.diff{float:left;color:#7b717f;font-size:.8rem}.q{font-weight:700;font-size:1.12rem;margin:10px 0}.choices{display:grid;gap:8px}.ch{border:1px solid #e6dce8;background:#fff;padding:12px;border-radius:14px;text-align:right}.ch.sel{border:2px solid #6d3c73;background:#fbf7fc}.input{width:100%;border:2px solid #dacdde;padding:11px;border-radius:13px;text-align:center;font:inherit}.fb,.hint,.more,.adapt{margin-top:11px;padding:12px;border-radius:14px}.ok{background:#eaf8f1;color:#0b6b42}.bad{background:#fff0ef;color:#963a32}.hint{background:#fff7d9;color:#68500b;border:1px solid #e9d788}.more{background:#fffdf4;border:1px dashed #d4bf68;color:#5f4b10}.adapt{background:#f1edff;color:#4c4174}.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}button{font:inherit;cursor:pointer}.pri,.sec,.moreBtn{border:0;border-radius:13px;padding:10px 13px}.pri{background:#6d3c73;color:#fff}.pri:disabled{opacity:.4}.sec{background:#eee7f0}.moreBtn{margin-top:8px;background:#fff0ad;color:#654e09;border:1px solid #ddc457}.report{display:none}.big{font-size:2.6rem;font-weight:800;color:#6d3c73}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}.stat{background:#faf7fb;border:1px solid #eadfeb;border-radius:14px;padding:10px}.stat b{display:block;font-size:1.2rem}table{width:100%;border-collapse:collapse;font-size:.86rem}th,td{padding:7px;border-bottom:1px solid #eadfeb;text-align:right;vertical-align:top}details{border:1px solid #eadfeb;border-radius:14px;padding:9px 11px;margin-top:8px}summary{font-weight:700;cursor:pointer}.att{background:#faf8fb;border-radius:10px;padding:8px;margin-top:7px;font-size:.86rem}.foot{margin-top:12px;color:#786f7b;font-size:.83rem}@media(max-width:520px){.w{padding:9px}.hero,.card,.report{border-radius:18px}.q{font-size:1.03rem}table{font-size:.78rem}}
</style></head><body><div class="w">
<section class="hero"><h1>🎯 تجربة الكويز التكيفي الممتع</h1><p>Hints بإيموجي + «اشرحلي نفس الهينت أكتر» + تقرير أهل مفصّل 😄</p></section>
<div id="quiz"><div class="top"><div class="bar"><b id="p"></b></div><div class="chip" id="score">0%</div></div><div class="meta"><span id="num"></span><span id="attemptLabel"></span></div><main class="card" id="card"></main></div>
<section class="report" id="report"></section><div class="foot">📘 Prototype من درس الكسور — كتاب الرياضيات للصف الخامس، صفحات PDF 55–57. النتائج محفوظة محليًا فقط بهذه النسخة.</div>
</div><script>
const success=["🎉 ممتاز! مسكت الفكرة.","🌟 حلو كتير!","🚀 خطوة لقدّام.","😄 السؤال استسلم!"], again=["🙂 قريب… عندنا مفتاح صغير.","🧩 ناقصنا قطعة وحدة.","🔎 خلينا نطلع عليها من زاوية ثانية.","😄 السؤال عم يتفلسف شوي…"];
const Q=[
{id:"q1",c:"الكسور المتكافئة",d:2,s:"مكيّف من الكتاب • PDF 55",t:"mcq",q:"أي كسر يكافئ 3/8؟",a:["6/16","3/16","6/8","8/16","9/16"],ok:0,
why:{1:"غيّرت المقام وحده.",2:"غيّرت البسط وحده.",3:"8/16 يساوي 1/2.",4:"9/16 أكبر من 3/8."},
h:["🔁 الكسر المكافئ يحافظ على نفس القيمة.","✖️ أي عملية على البسط لازم تعملها على المقام أيضًا.","🧮 جرّب تضاعف البسط والمقام بنفس العدد.","🪄 دور على خيار ناتج من نفس العملية فوق وتحت."],
x:["تخيّل نفس قطعة الشوكولا 🍫 مقسمة لقطع أصغر أكثر؛ الشكل يتغير لكن الكمية لا تتغير.","المعادلة لازم تكون متوازنة: إذا ضربت فوق في عدد، اضرب تحت في نفس العدد.","اختار عددًا بسيطًا وطبّقه على الرقمين معًا، من دون تغيير الفكرة نفسها.","افحص الخيارات واحدًا واحدًا: هل جاء من 3/8 بضرب الرقمين بنفس العدد؟"],
good:"لما نضرب البسط والمقام بنفس العدد نحصل على كسر مكافئ."},
{id:"q2",c:"مقارنة الكسور",d:3,s:"مكيّف من الكتاب • PDF 56",t:"mcq",q:"أي علاقة صحيحة بين 2/5 و1/3؟",a:["2/5 > 1/3","2/5 < 1/3","2/5 = 1/3","لا يمكن المقارنة","المقام الأكبر يعني الكسر أكبر"],ok:0,
why:{1:"ممكن المقامات المختلفة تخدعنا.",2:"الكسران مو متساويين.",3:"نقدر نقارن بعد توحيد المقام.",4:"المقام الأكبر لا يعني كسرًا أكبر."},
h:["🛠️ خلي الكسرين بنفس نوع الأجزاء.","🔢 ابحث عن مقام مشترك للمقامين.","🔁 كوّن كسرين مكافئين بالمقام نفسه.","📏 عند نفس المقام، قارن البسطين."],
x:["مثل مقارنة طولين: لازم نقيسهم بوحدة واحدة أولًا. هنا «الوحدة» هي حجم الجزء.","المقام المشترك يعطينا أجزاء من نفس الحجم حتى تكون المقارنة عادلة.","لا تغيّر قيمة الكسر؛ اضرب البسط والمقام بنفس العدد للوصول للمقام المشترك.","بعد ما صار حجم الجزء نفسه، عدد الأجزاء هو اللي يحدد مين أكبر."],
good:"توحيد المقامات يجعل المقارنة مباشرة وواضحة."},
{id:"q3",c:"ترتيب الكسور",d:4,s:"مكيّف من الكتاب • PDF 56",t:"mcq",adaptive:true,q:"أي ترتيب تصاعدي صحيح: 3/4 ، 1/3 ، 5/6 ، 7/12 ؟",a:["1/3 < 7/12 < 3/4 < 5/6","7/12 < 1/3 < 3/4 < 5/6","1/3 < 3/4 < 7/12 < 5/6","5/6 < 3/4 < 7/12 < 1/3","3/4 < 7/12 < 1/3 < 5/6"],ok:0,
why:{1:"البداية ليست من الأصغر.",2:"راجع مكان 7/12 و3/4.",3:"هذا تقريبًا ترتيب تنازلي.",4:"3/4 ليس الأصغر."},
h:["🪜 التصاعدي يعني من الأصغر للأكبر.","🧮 وحّد مقامات الكسور كلها.","🧱 بعد التوحيد، رتب البسوط فقط.","👣 امشِ من أصغر بسط لأكبر بسط."],
x:["لا تقارن الأربعة دفعة واحدة؛ اعتبرها درجات سلّم تبدأ بالأصغر وتنتهي بالأكبر.","اختار مقامًا تستطيع كل المقامات الوصول إليه حتى تصبح الأجزاء من نفس النوع.","لما يصير المقام نفسه للجميع، المقام ما عاد يفرق؛ المهمة تتحول لترتيب البسوط.","رتب البسوط أولًا على ورقة ذهنية، ثم أرجع كل بسط للكسر الأصلي."],
good:"بعد توحيد المقامات يصير ترتيب الكسور أسهل.",
rem:{id:"r3",role:"remediation",c:"ترتيب الكسور",d:4,s:"سؤال تثبيت • نفس المفهوم والصعوبة",t:"mcq",q:"🎯 سؤال تثبيت: أي ترتيب تصاعدي صحيح؟",a:["1/2 < 2/3 < 3/4 < 5/6","2/3 < 1/2 < 3/4 < 5/6","1/2 < 3/4 < 2/3 < 5/6","5/6 < 3/4 < 2/3 < 1/2","3/4 < 1/2 < 2/3 < 5/6"],ok:0,
why:{1:"راجع أول كسرين.",2:"راجع 2/3 و3/4.",3:"هذا تنازلي.",4:"1/2 أصغر من 3/4."},h:["🪜 ابدأ من الأصغر.","🧮 استخدم مقامًا مشتركًا.","🧱 رتّب البسوط بعد التوحيد.","👣 من الأصغر للأكبر."],x:["قسّم المهمة لمقارنات صغيرة.","المقام المشترك يجعل الوحدات متساوية.","بعدها تصبح المهمة ترتيب أرقام بسيطة.","أعد كل بسط للكسر الأصلي."],good:"ممتاز، هذا يثبت فهم الفكرة نفسها."}}
];
let queue=Q.map(q=>({...q,role:"core"})),i=0,tr=1,sel=null,wrong=0,done=[],log=[],expanded=new Set(),remFlag=false;const w=[100,75,50,25],card=document.getElementById("card"),num=document.getElementById("num"),attemptLabel=document.getElementById("attemptLabel"),p=document.getElementById("p"),score=document.getElementById("score"),quiz=document.getElementById("quiz"),report=document.getElementById("report");
function curScore(){let a=done.filter(x=>x.role==="core");return a.length?Math.round(a.reduce((s,x)=>s+x.score,0)/a.length):0}
function render(){let q=queue[i];tr=1;sel=null;wrong=0;expanded=new Set();num.textContent=q.role==="remediation"?"🔁 سؤال تثبيت":`السؤال ${Q.findIndex(x=>x.id===q.id)+1} من ${Q.length}`;attemptLabel.textContent="المحاولة 1 من 4";p.style.width=`${done.filter(x=>x.role==="core").length/Q.length*100}%`;score.textContent=curScore()+"%";draw(q)}
function draw(q){card.innerHTML=`<span class="tag">${q.s}</span><span class="diff">الصعوبة ${q.d}/5</span><div class="q">${q.q}</div><div class="choices">${q.a.map((x,n)=>`<button class="ch" data-n="${n}">${x}</button>`).join("")}</div><div id="z"></div><div class="acts"><button class="pri" id="ck" disabled>تحقّق</button></div>`;const ck=document.getElementById("ck");card.querySelectorAll(".ch").forEach(b=>b.onclick=()=>{card.querySelectorAll(".ch").forEach(x=>x.classList.remove("sel"));b.classList.add("sel");sel=+b.dataset.n;ck.disabled=false});ck.onclick=()=>check(q)}
function check(q){const z=document.getElementById("z"),ck=document.getElementById("ck");let n=tr,ans=q.a[sel],right=sel===q.ok;if(right){log.push({id:q.id,q:q.q,c:q.c,role:q.role,tr:n,ans,right:true,h:0,more:false,msg:q.good});z.innerHTML=`<div class="fb ok"><b>${success[n%success.length]}</b><br>${q.good}</div>`;lock(q);ck.style.display="none";next(q,q.role==="core"?w[n-1]:0,true);return}wrong++;log.push({id:q.id,q:q.q,c:q.c,role:q.role,tr:n,ans,right:false,h:n,more:false,msg:q.why[sel]||"غيّر زاوية التفكير."});let a="";if(q.adaptive&&wrong===3&&!remFlag){remFlag=true;a=`<div class="adapt"><b>🔁 السيستم لاحظ تعثّرًا</b><br>بعد هذا السؤال رح يضيف سؤال تثبيت من نفس المفهوم ونفس الصعوبة.</div>`}z.innerHTML=`<div class="fb bad"><b>${again[n%again.length]}</b><br>${q.why[sel]||"غيّر زاوية التفكير."}</div><div class="hint"><b>${q.h[n-1]}</b><br><button class="moreBtn" id="more">🧠 اشرحلي نفس الهينت أكتر</button></div><div id="mx"></div>${a}`;const more=document.getElementById("more"),mx=document.getElementById("mx");more.onclick=()=>{if(expanded.has(n))return;expanded.add(n);mx.innerHTML=`<div class="more"><b>🔍 نفس المستوى، شرح أوسع:</b><br>${q.x[n-1]}</div>`;let L=[...log].reverse().find(x=>x.id===q.id&&x.tr===n&&!x.right);if(L)L.more=true};sel=null;tr++;attemptLabel.textContent=`المحاولة ${Math.min(tr,4)} من 4`;ck.disabled=true;if(tr>4){lock(q);ck.style.display="none";z.innerHTML+=`<div class="fb bad"><b>🧠 هون منوقف التخمين ونرتّب الفكرة.</b><br>${q.good}<br>السؤال يأخذ 0% لكن كل المحاولات محفوظة بالتقرير.</div>`;next(q,0,false)}}
function lock(q){card.querySelectorAll(".ch").forEach((b,n)=>{b.disabled=true;if(n===q.ok)b.style.background="#eaf8f1"})}
function next(q,s,ok){let b=document.createElement("button");b.className="sec";b.textContent=q.role==="remediation"?"كمّل 🚀":"السؤال التالي ➜";b.onclick=()=>finish(q,s,ok);card.querySelector(".acts").appendChild(b)}
function finish(q,s,ok){done.push({id:q.id,role:q.role,c:q.c,score:s,wrong,ok});if(q.adaptive&&remFlag&&q.rem&&!queue.some(x=>x.id===q.rem.id))queue.splice(i+1,0,{...q.rem});i++;i>=queue.length?showReport():render()}
function E(s){return String(s??"").replace(/[&<>\"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'\"':"&quot;"}[c]))}
function showReport(){quiz.style.display="none";report.style.display="block";let core=done.filter(x=>x.role==="core"),rem=done.filter(x=>x.role==="remediation"),final=Math.round(core.reduce((a,b)=>a+b.score,0)/core.length),first=core.filter(x=>x.score===100).length,hints=log.filter(x=>!x.right).length,mores=log.filter(x=>x.more).length;let rows=core.map(d=>{let ls=log.filter(x=>x.id===d.id);return `<tr><td>${E(d.c)}</td><td>${ls.length}</td><td>${d.wrong}</td><td>${ls.filter(x=>x.more).length}</td><td>${d.score}%</td></tr>`}).join("");let details=queue.filter(q=>log.some(x=>x.id===q.id)).map(q=>`<details><summary>${q.role==="remediation"?"🔁":"📝"} ${E(q.q)}</summary>${log.filter(x=>x.id===q.id).map(x=>`<div class="att"><b>المحاولة ${x.tr}: ${x.right?"✅ صحيحة":"❌ غير صحيحة"}</b><br>إجابة الطالب: <b>${E(x.ans)}</b>${x.right?"":`<br>Hint ${x.h} • ${x.more?"فتح الشرح الموسّع 🧠":"لم يفتح الشرح الموسّع"}`}<br>${E(x.msg)}</div>`).join("")}</details>`).join("");report.innerHTML=`<h2>📊 تقرير الأهل — ملخص</h2><div class="big">${final}%</div><div class="grid"><div class="stat">صح من أول مرة<b>${first}/${core.length}</b></div><div class="stat">Hints<b>${hints}</b></div><div class="stat">شرح موسّع<b>${mores}</b></div><div class="stat">أسئلة تثبيت<b>${rem.length}</b></div></div><h3>ملخص كل سؤال</h3><div style="overflow:auto"><table><tr><th>المفهوم</th><th>محاولات</th><th>Hints</th><th>شرح موسّع</th><th>درجة</th></tr>${rows}</table></div><h3>🔎 تفاصيل كل محاولة</h3>${details}<div class="acts"><button class="pri" onclick="location.reload()">إعادة التجربة 🔄</button></div>`}
render();
</script></body></html>
