function curScore(){let a=done.filter(x=>x.role==="core");return a.length?Math.round(a.reduce((s,x)=>s+x.score,0)/a.length):0}function render(){let q=queue[i];tr=1;sel=null;wrong=0;expanded=new Set();num.textContent=q.role==="remediation"?"🔁 سؤال تثبيت":`السؤال ${Q.findIndex(x=>x.id===q.id)+1} من ${Q.length}`;attemptLabel.textContent="المحاولة 1 من 4";p.style.width=`${done.filter(x=>x.role==="core").length/Q.length*100}%`;score.textContent=curScore()+"%";draw(q)}
function draw(q){card.innerHTML=`<span class="tag">${E(q.s)}</span><span class="diff">الصعوبة ${q.d}/5</span><div class="q">${renderMath(q.q)}</div><div class="choices">${q.a.map((x,n)=>`<button class="ch" data-n="${n}">${renderMath(x)}</button>`).join("")}</div><div id="z"></div><div class="acts"><button class="pri" id="ck" disabled>تحقّق</button></div>`;const ck=document.getElementById("ck");card.querySelectorAll(".ch").forEach(b=>b.onclick=()=>{card.querySelectorAll(".ch").forEach(x=>x.classList.remove("sel"));b.classList.add("sel");sel=+b.dataset.n;ck.disabled=false});ck.onclick=()=>check(q)}
function check(q){const z=document.getElementById("z"),ck=document.getElementById("ck");let n=tr,ans=q.a[sel],right=sel===q.ok;if(right){log.push({id:q.id,q:q.q,c:q.c,role:q.role,tr:n,ans,right:true,h:0,more:false,msg:q.good});z.innerHTML=`<div class="fb ok"><b>${success[n%success.length]}</b><br>${renderMath(q.good)}</div>`;lock(q);ck.style.display="none";next(q,q.role==="core"?w[n-1]:0,true);return}wrong++;log.push({id:q.id,q:q.q,c:q.c,role:q.role,tr:n,ans,right:false,h:n,more:false,msg:q.why[sel]||"غيّر زاوية التفكير."});let a="";if(q.adaptive&&wrong===3&&!remFlag){remFlag=true;a=`<div class="adapt"><b>🔁 السيستم لاحظ تعثّرًا</b><br>بعد هذا السؤال رح يضيف سؤال تثبيت من نفس المفهوم ونفس الصعوبة.</div>`}z.innerHTML=`<div class="fb bad"><b>${again[n%again.length]}</b><br>${renderMath(q.why[sel]||"غيّر زاوية التفكير.")}</div><div class="hint"><div class="hintTitle">💡 Hint ${n}/4</div>${renderSteps(q.h[n-1])}<button class="moreBtn" id="more">🧠 اشرحلي نفس الهينت أكتر</button></div><div id="mx"></div>${a}`;const more=document.getElementById("more"),mx=document.getElementById("mx");more.onclick=()=>{if(expanded.has(n))return;expanded.add(n);mx.innerHTML=`<div class="more"><div class="hintTitle">🔍 نفس الـHint، بشرح أوسع — 6 خطوات</div>${renderSteps(q.x[n-1])}</div>`;let L=[...log].reverse().find(x=>x.id===q.id&&x.tr===n&&!x.right);if(L)L.more=true};sel=null;tr++;attemptLabel.textContent=`المحاولة ${Math.min(tr,4)} من 4`;ck.disabled=true;if(tr>4){lock(q);ck.style.display="none";z.innerHTML+=`<div class="fb bad"><b>🧠 هون منوقف التخمين ونرتّب الفكرة.</b><br>${renderMath(q.good)}<br>السؤال يأخذ 0% لكن كل المحاولات محفوظة بالتقرير.</div>`;next(q,0,false)}}
function lock(q){card.querySelectorAll(".ch").forEach((b,n)=>{b.disabled=true;if(n===q.ok)b.style.background="#eaf8f1"})}function next(q,s,ok){let b=document.createElement("button");b.className="sec";b.textContent=q.role==="remediation"?"كمّل 🚀":"السؤال التالي ➜";b.onclick=()=>finish(q,s,ok);card.querySelector(".acts").appendChild(b)}function finish(q,s,ok){done.push({id:q.id,role:q.role,c:q.c,score:s,wrong,ok});if(q.adaptive&&remFlag&&q.rem&&!queue.some(x=>x.id===q.rem.id))queue.splice(i+1,0,{...q.rem});i++;i>=queue.length?showReport():render()}
function showReport(){quiz.style.display="none";report.style.display="block";let core=done.filter(x=>x.role==="core"),rem=done.filter(x=>x.role==="remediation"),final=Math.round(core.reduce((a,b)=>a+b.score,0)/core.length),first=core.filter(x=>x.score===100).length,hints=log.filter(x=>!x.right).length,mores=log.filter(x=>x.more).length;let rows=core.map(d=>{let ls=log.filter(x=>x.id===d.id);return `<tr><td>${E(d.c)}</td><td>${ls.length}</td><td>${d.wrong}</td><td>${ls.filter(x=>x.more).length}</td><td>${d.score}%</td></tr>`}).join("");let details=queue.filter(q=>log.some(x=>x.id===q.id)).map(q=>`<details><summary>${q.role==="remediation"?"🔁":"📝"} ${renderMath(q.q)}</summary>${log.filter(x=>x.id===q.id).map(x=>`<div class="att"><b>المحاولة ${x.tr}: ${x.right?"✅ صحيحة":"❌ غير صحيحة"}</b><br>إجابة الطالب: <b>${renderMath(x.ans)}</b>${x.right?"":`<br>Hint ${x.h} • ${x.more?"فتح الشرح الموسّع 🧠":"لم يفتح الشرح الموسّع"}`}<br>${renderMath(x.msg)}</div>`).join("")}</details>`).join("");report.innerHTML=`<h2>📊 تقرير الأهل — ملخص</h2><div class="big">${final}%</div><div class="grid"><div class="stat">صح من أول مرة<b>${first}/${core.length}</b></div><div class="stat">Hints<b>${hints}</b></div><div class="stat">شرح موسّع<b>${mores}</b></div><div class="stat">أسئلة تثبيت<b>${rem.length}</b></div></div><h3>ملخص كل سؤال</h3><div style="overflow:auto"><table><tr><th>المفهوم</th><th>محاولات</th><th>Hints</th><th>شرح موسّع</th><th>درجة</th></tr>${rows}</table></div><h3>🔎 تفاصيل كل محاولة</h3>${details}<div class="acts"><button class="pri" onclick="location.reload()">إعادة التجربة 🔄</button></div>`}
render();
</script></body></html>
