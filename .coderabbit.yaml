# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: "en-US"

reviews:
  profile: "assertive"
  request_changes_workflow: true
  high_level_summary: true
  review_status: true
  poem: false
  auto_review:
    enabled: true
    drafts: false

  pre_merge_checks:
    custom_checks:
      - name: "Feature Spec Contract"
        mode: "warning"
        instructions: |
          Evaluate requirement traceability for the current pull request.
          Pass when either:
          1. The PR is truly trivial or engineering-process/configuration-only and explicitly records a credible N/A reason for the Feature Spec fields; or
          2. A non-trivial product, workflow, data/security, externally observable API, learner/parent behavior, or meaningful bug-fix change pins FEATURE_ID, SPEC_VERSION, SPEC_URL, and DRIVE_REVISION_ID, includes a concrete acceptance-criteria summary, and the implementation/tests stay within that pinned contract.
          Warn when required fields are missing/placeholders, the TestSprite requirement source differs from the pinned Feature Spec, or the diff silently expands/contradicts the pinned acceptance criteria.

      - name: "Security and Tenant Isolation"
        mode: "warning"
        instructions: |
          Evaluate only security, authorization, tenant/workspace/learner isolation, and privileged-access risks introduced by this PR.
          Pass when the PR does not change those boundaries, or when relevant changes preserve session-derived identity, workspace/learner scoping, RLS and grants, intended SECURITY INVOKER/DEFINER behavior, safe search_path, least-privilege ACLs, and correct 401/403 failure behavior.
          Warn on client-supplied identity trusted where session identity is required, weakened/bypassed RLS, broadened service-role or RPC privileges without a narrowly justified contract, cross-learner/workspace exposure, or missing deterministic security/contract coverage for a changed boundary.

      - name: "Migration Safety"
        mode: "warning"
        instructions: |
          Apply this check when the PR changes Supabase/database migrations or schema-affecting SQL; otherwise pass.
          Pass when migration history remains immutable, fixes are forward-only, new migrations are safely scoped and idempotent where practical, RLS/grants/search_path/ACL invariants are preserved, production-vs-fresh-database implications are documented, and relevant preflight/contract/rollback-or-cleanup verification is present.
          Warn on rewriting/reordering/reusing historical applied migrations, destructive or broad schema changes without explicit scope and recovery notes, weakened authorization, or migration behavior that lacks the deterministic verification required by docs/qa-policy.md.

      - name: "Sensitive Data and Logging"
        mode: "warning"
        instructions: |
          Inspect changed code, workflow/configuration, logs/telemetry behavior, DOM/report output, and QA evidence paths for sensitive-data exposure.
          Pass only when the PR introduces no secrets, tokens, PINs, credentials, service keys, authorization headers, cookies, sensitive request/response bodies, or real learner private data into source, logs, DOM output, screenshots, reports, fixtures, or artifacts.
          Telemetry must use allowlisted non-sensitive fields. Automated QA must use testing data and must not expose Mohammad/Aya real state. Warn on any new exposure path or hard-coded live credential.

      - name: "QA Gate Integrity"
        mode: "warning"
        instructions: |
          Evaluate whether this PR preserves Family Learning Hub merge-safety infrastructure and selects appropriate deterministic coverage for the risk changed.
          Pass when PRs targeting main cannot bypass QA by path filters, Static quality remains before Browser smoke, required exact-SHA checks are preserved, meaningful assertions are not weakened merely to pass CI, and affected product/security/database behavior has the lowest reliable unit/contract/browser regression coverage or a credible N/A reason.
          Preserve seven-day temporary Playwright screenshot artifacts for meaningful UI changes. Warn on any bypass, stale-SHA reuse, removed/softened safety assertion without equal replacement, or mismatch between the PR's declared testing strategy and the actual changed risk.

  path_filters:
    - "!**/node_modules/**"
    - "!**/*.min.js"
    - "!**/*.png"
    - "!**/*.jpg"
    - "!**/*.jpeg"
    - "!**/*.webp"

  path_instructions:
    - path: "**/*"
      instructions: |
        For every non-trivial change, verify the PR pins FEATURE_ID, SPEC_VERSION, SPEC_URL, and DRIVE_REVISION_ID, and that these match the contract used by Codex/TestSprite.
        Require the PR to include an acceptance-criteria summary for the pinned Feature Spec.
        Treat docs/feature-spec-workflow.md as the repository-wide handoff contract. Flag silent scope drift or implementation/tests that contradict the pinned acceptance criteria, regardless of file type.

    - path: "**/*.{js,ts,mjs,html,css}"
      instructions: |
        Review this repository against the canonical constraints in AGENTS.md, docs/architecture.md, docs/qa-policy.md, and docs/math-rendering-invariant.md.
        Review this as a child-facing, mobile-first Arabic/RTL learning application.
        - Prioritize regressions in student navigation, learning mode, exam mode, parent access, and content isolation between learners.
        - Flag hard-coded learner names, grades, books, quizzes, or curriculum access when the behavior should be data-driven.
        - Preserve the hierarchy: program or standalone book -> book -> unit -> learning/exam mode.
        - Learning mode may provide hints and feedback; exam mode must not reveal correctness before final submission.
        - Treat server-authoritative grading and saved state as security/integrity requirements. Flag any client-trusted score or grading path.
        - Check mobile touch usability, accidental double actions, loading states, resume behavior, and RTL layout.
        - Flag visible English UI copy that should be Arabic, Arabic spelling/copy regressions, and reversed school-year strings.
        - Do not recommend reviving legacy quiz/exam runtime files that the active index no longer loads.
        - Treat RTL-safe math rendering as a platform invariant for every learner, not a quiz-specific fix. The Arabic shell stays RTL, but every mathematical expression, negative number, math option, math explanation, learner/correct numeric answer, and numeric/decimal input must preserve logical left-to-right mathematical order with bidi isolation.
        - Flag any raw rendering path that can place question prompts, option values, hints, explanations, learner answers, or correct answers into RTL UI without going through the shared math renderer or the approved bidi-isolation layer.
        - Never fix bidi by reversing operands, signs, strings, or stored data. Direction is a rendering concern only.
        - Changes to math-direction-v1.js/css or any Learning/Exam/review math surface must preserve regression coverage for Learning Mode, Exam Mode, completed/review screens, negative signs, and operand order.
        - Review test selection as part of implementation: non-trivial pure/isolatable business, validation, authorization, scoring, parsing, state-transition, and error-handling logic should normally have unit coverage; meaningful Supabase/RLS/API/persistence boundaries should have integration/contract coverage when unit tests cannot prove the boundary; important user-visible flows should have Playwright/browser coverage.
        - For an important bug fix, flag the absence of a deterministic regression test when a practical test at the lowest reliable layer could reproduce the defect.
        - Do not mechanically demand a unit test for every function or trivial pass-through. Prefer high-value behavior coverage over brittle implementation-detail tests.

    - path: "supabase/functions/**"
      instructions: |
        Treat Edge Functions as security and data-integrity boundaries.
        - Check authentication, authorization, workspace scoping, learner-content isolation, input validation, error handling, and server-authoritative results.
        - Flag service-role or privileged queries that are not tightly scoped to the authenticated workspace/learner/action.
        - When non-trivial logic is extractable or already extracted from the transport layer, expect focused unit coverage for that logic.
        - When correctness depends on the real database/RLS/API contract, expect an integration/contract regression rather than relying only on mocks.
        - Verify that failure/zero-row cases are not silently reported as success.

    - path: "supabase/migrations/**"
      instructions: |
        Review migrations for production safety, RLS, grants, constraints, and forward-only reconciliation.
        - Do not rewrite migration history that may already be applied in production; prefer a new forward reconciliation migration.
        - Flag exposed workspace-scoped tables without appropriate RLS or policies.
        - Check that security-definer functions, grants, and role permissions are no broader than required.
        - Expect the PR to describe production-vs-fresh-database state and verification when relevant.

    - path: "tests/**"
      instructions: |
        Treat QA tests as merge-safety infrastructure.
        - Flag changes that weaken assertions only to make a failing test pass.
        - Require coverage for the behavior/risk changed by the PR, using the lowest reliable layer defined in docs/qa-policy.md.
        - Important bug fixes should normally gain a deterministic regression test unless the PR gives a credible reason or existing coverage already reproduces the issue.
        - Keep deterministic checks for Arabic copy, runtime file references, math directionality, learner-content isolation, and legacy-engine guards.
        - Prefer mocked external APIs in browser smoke tests so CI remains stable and reproducible, but do not accept mocks as proof of real RLS/database boundaries when an integration/contract test is needed.
        - Avoid brittle tests that assert implementation details without protecting user-visible or security-critical behavior.
        - Preserve the math-rendering architecture guard and real-browser coverage of actual Learning, Exam, and review flows. Do not replace these with a synthetic DOM-only probe.
        - Required bidi regression corpus includes both operand orders and leading negative signs, including 19 - (-7), (-7) - 19, -7 + 19, 19 + (-7), -21 - (-6), and -26.
        - Preserve Playwright screenshot evidence for meaningful user-facing UI states. Evidence should use mocked/non-sensitive data, write to the temporary playwright-screenshots/ runtime folder, and must not expose credentials.

    - path: ".github/workflows/**"
      instructions: |
        Protect the QA Gate.
        - QA must run on every pull request targeting main, regardless of changed file type.
        - Static quality must run before browser QA.
        - The math-rendering architecture guard, deterministic math-direction regression, and browser regression must not be removed or bypassed.
        - Playwright screenshot evidence must be uploaded as a GitHub Actions artifact from playwright-screenshots/ with retention-days: 7. Do not replace temporary artifact storage with committing screenshots to repository history.
        - Do not add paths filters that would allow a PR to bypass QA.
        - Flag permissions broader than required and avoid exposing secrets to untrusted pull requests.
        - Flag removal of meaningful unit, integration, browser, regression, or static checks unless replaced by equal or stronger deterministic coverage.

    - path: "docs/**"
      instructions: |
        Check architecture and QA documentation for consistency with the live system and with AGENTS.md.
        Preserve the Feature Spec pinning model: Drive is the canonical behavior source; each non-trivial branch/PR pins its own FEATURE_ID, SPEC_VERSION, URL, and retrievable Drive revision ID; there is no global current-feature pointer.
        Flag claims that a feature or gate is enforced when it is only advisory or not actually configured.
        Preserve the seven-day temporary Playwright screenshot evidence policy and the rule against committing transient QA screenshots to Git history.
        Preserve the tool-routing distinction: automated Playwright in GitHub Actions remains required deterministic CI, while the dedicated Family Learning Hub Playwright MCP is a fallback for browser-dependent verification when no direct structured tool can prove or perform the same task.

    - path: "AGENTS.md"
      instructions: |
        Treat this file as the concise repository-wide development contract.
        Keep it aligned with docs/architecture.md, docs/qa-policy.md, and docs/math-rendering-invariant.md, and flag rules that contradict the actual CI/runtime architecture.

knowledge_base:
  code_guidelines:
    enabled: true
    filePatterns:
      - "docs/architecture.md"
      - "docs/qa-policy.md"
      - "docs/math-rendering-invariant.md"

chat:
  auto_reply: true
