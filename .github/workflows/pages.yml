name: Deploy to GitHub Pages

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Approved full main commit SHA to publish
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Build approved main site
        id: site
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          test "${GITHUB_EVENT_NAME}" = workflow_dispatch
          test "${GITHUB_REF}" = refs/heads/main
          [[ "${EXPECTED_SHA}" =~ ^[0-9a-f]{40}$ ]]
          test "${GITHUB_SHA}" = "${EXPECTED_SHA}"
          test "$(git rev-parse HEAD)" = "${EXPECTED_SHA}"
          git fetch --no-tags origin main
          test "$(git rev-parse FETCH_HEAD)" = "${EXPECTED_SHA}"
          SITE_DIR="$(mktemp -d "${RUNNER_TEMP}/family-learning-hub-pages.XXXXXX")"
          git archive "${EXPECTED_SHA}" | tar -x -C "${SITE_DIR}"
          test ! -e "${SITE_DIR}/pr-preview"
          touch "${SITE_DIR}/.nojekyll"
          echo "site_dir=${SITE_DIR}" >> "$GITHUB_OUTPUT"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ steps.site.outputs.site_dir }}

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
