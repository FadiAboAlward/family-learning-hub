name: Isolated QA Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

env:
  FLH_QA_DNS_DENY_EXPECTED: '1'
  FLH_QA_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

permissions:
  contents: read

jobs:
  static-quality:
    name: Static quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: qa-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Assert checked-out SHA
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Deny Production backend traffic
        run: |
          printf '%s\n' '127.0.0.1 gkpoylfozvuwuwqeoduc.supabase.co db.gkpoylfozvuwuwqeoduc.supabase.co' '::1 gkpoylfozvuwuwqeoduc.supabase.co db.gkpoylfozvuwuwqeoduc.supabase.co' | sudo tee -a /etc/hosts > /dev/null
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Verify Production network deny
        run: node tests/qa-ci-network.mjs
      - name: JavaScript and TypeScript syntax checks
        run: |
          find . -maxdepth 1 -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          find tests -type f -name '*.mjs' -print0 | xargs -0 -n1 node --check
          find scripts -type f -name '*.mjs' -print0 | xargs -0 -n1 node --check
          find supabase/functions/exam-v2-api -type f -name '*.mjs' -print0 | xargs -0 -n1 node --check
          find supabase/functions/_shared -type f -name '*.mjs' -print0 | xargs -0 -n1 node --check
          npx --yes esbuild@0.25.9 supabase/functions/learning-api/index.ts --format=esm --platform=neutral --outfile=/tmp/learning-api-check.js
          npx --yes esbuild@0.25.9 supabase/functions/student-library-api/index.ts --format=esm --platform=neutral --outfile=/tmp/student-library-api-check.js
          npx --yes esbuild@0.25.9 supabase/functions/family-api/index.ts --format=esm --platform=neutral --outfile=/tmp/family-api-check.js
          npx --yes esbuild@0.25.9 supabase/functions/activity-api/index.ts --format=esm --platform=neutral --outfile=/tmp/activity-api-check.js
          npx --yes esbuild@0.25.9 supabase/functions/exam-v2-api/index.ts --format=esm --platform=neutral --outfile=/tmp/exam-v2-api-check.js
          npx --yes esbuild@0.25.9 supabase/functions/attempt-history-api/index.ts --format=esm --platform=neutral --outfile=/tmp/attempt-history-api-check.js
          npx --yes esbuild@0.25.9 supabase/functions/qa-auth/index.ts --format=esm --platform=neutral --outfile=/tmp/qa-auth-check.js
      - name: Static product QA
        run: node tests/static-qa.mjs
      - name: Academic content quality guard
        run: node tests/academic-content-quality.mjs
      - name: Official support workbook content guard
        run: node scripts/academic-content-quality.mjs content/tr-math-g5-meb-support-set1-v1.json
      - name: Math rendering architecture guard
        run: node tests/math-rendering-guard.mjs
      - name: Math direction regression
        run: node tests/math-direction.mjs
      - name: Content direction regression
        run: node tests/content-direction.mjs
      - name: Exam API unit tests
        run: node tests/exam-v2-api.mjs
      - name: Convention-based unit test suite
        shell: bash
        run: |
          shopt -s nullglob
          unit_tests=(tests/*.unit.mjs)
          if (( ${#unit_tests[@]} == 0 )); then
            echo "No convention-based unit tests found."
            exit 0
          fi
          for test_file in "${unit_tests[@]}"; do
            echo "Running $test_file"
            node "$test_file"
          done
      - name: Rebuild database from zero
        run: |
          npx --yes supabase@2.117.0 db start
          npx --yes supabase@2.117.0 db reset --local --no-seed
      - name: Verify reconstructed schema and fixtures
        run: npx --yes supabase@2.117.0 db query --local --file tests/fresh-database-rebuild.sql
      - name: Verify learner content assignment RLS contract
        run: npx --yes supabase@2.117.0 db query --local --file tests/learner-content-assignments-rls.contract.sql
      - name: Verify authenticated authorization and session privacy
        run: npx --yes supabase@2.117.0 db query --local --file tests/auth-session-privacy.contract.sql
      - name: Verify workspace relational integrity contract
        run: npx --yes supabase@2.117.0 db query --local --file tests/workspace-relational-integrity.contract.sql
      - name: Verify learner-independent catalog normalization
        run: npx --yes supabase@2.117.0 db query --local --file tests/catalog-normalization.contract.sql
      - name: Verify Learning answer RPC contract
        run: npx --yes supabase@2.117.0 db query --local --file tests/learning-answer-rpc.contract.sql
      - name: Verify typed support-workbook Learning responses
        run: npx --yes supabase@2.117.0 db query --local --file tests/support-workbook-typed-learning.contract.sql
      - name: Verify typed support-workbook draft and answer concurrency
        run: node tests/support-workbook-typed-learning.concurrency.mjs
      - name: Verify Learning answer concurrency and idempotency
        run: node tests/learning-answer-rpc.concurrency.mjs
      - name: Verify Learning start RPC contract
        run: npx --yes supabase@2.117.0 db query --local --file tests/learning-start-rpc.contract.sql
      - name: Verify Learning start concurrency and idempotency
        run: node tests/learning-start-rpc.concurrency.mjs
      - name: Verify cross-version attempt resume
        run: npx --yes supabase@2.117.0 db query --local --file tests/versioned-attempt-resume.contract.sql
      - name: Verify compact learner journey history and scope
        run: npx --yes supabase@2.117.0 db query --local --file tests/learner-journey-progress.contract.sql
      - name: Verify Learning finish RPC contract
        run: npx --yes supabase@2.117.0 db query --local --file tests/learning-finish-rpc.contract.sql
      - name: Verify Learning finish concurrency and idempotency
        run: node tests/learning-finish-rpc.concurrency.mjs
      - name: Verify family rewards authorization and ledger contract
        run: npx --yes supabase@2.117.0 db query --local --file tests/family-rewards.contract.sql
      - name: Verify family rewards concurrent awards and spending
        run: node tests/family-rewards.concurrency.mjs
      - name: Verify optional Learning video authorization and self-report contract
        run: npx --yes supabase@2.117.0 db query --local --file tests/optional-learning-videos.contract.sql
      - name: Verify ordered optional Learning video sequence contract
        run: npx --yes supabase@2.117.0 db query --local --file tests/optional-learning-video-sequence.contract.sql
      - name: Verify authored video outcomes and immutable snapshots
        run: npx --yes supabase@2.117.0 db query --local --file tests/optional-learning-video-outcomes.contract.sql
      - name: Verify optional Learning video sequence concurrency
        run: node tests/optional-learning-video-sequence.concurrency.mjs
      - name: Verify paper unanswered Exam contract
        run: npx --yes supabase@2.117.0 db query --local --file tests/paper-unanswered-exam.contract.sql
      - name: Verify support-workbook paper ingestion
        run: npx --yes supabase@2.117.0 db query --local --file tests/support-workbook-paper-ingestion.contract.sql
      - name: Verify support paper/digital Learning mutual exclusion
        run: npx --yes supabase@2.117.0 db query --local --file tests/support-paper-learning-mutual-exclusion.contract.sql
      - name: Verify support paper/digital Learning start concurrency
        run: node tests/support-paper-learning-mutual-exclusion.concurrency.mjs
      - name: Verify Exam mastery reward contract
        run: docker exec -i supabase_db_family-learning-hub psql -X -q -v ON_ERROR_STOP=1 -U postgres -d postgres < tests/exam-mastery-rewards.contract.sql
      - name: Verify Exam mastery reward concurrency and idempotency
        run: node tests/exam-mastery-rewards.concurrency.mjs
      - name: Verify Exam answer save/submit concurrency
        run: node tests/exam-save-submit-race.concurrency.mjs
      - name: Lint reconstructed database
        run: npx --yes supabase@2.117.0 db lint --local --schema public,private --level error --fail-on error
      - name: Stop local database
        if: always()
        run: npx --yes supabase@2.117.0 stop --no-backup

  browser-smoke:
    name: Browser smoke
    env:
      FLH_QA_ISOLATION_MODE: mock-local
    needs: static-quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: isolated-browser-${{ github.repository }}-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Assert checked-out SHA
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Deny Production backend traffic
        run: |
          printf '%s\n' '127.0.0.1 gkpoylfozvuwuwqeoduc.supabase.co db.gkpoylfozvuwuwqeoduc.supabase.co' '::1 gkpoylfozvuwuwqeoduc.supabase.co db.gkpoylfozvuwuwqeoduc.supabase.co' | sudo tee -a /etc/hosts > /dev/null
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Verify Production network deny
        run: node tests/qa-ci-network.mjs
      - name: Install browser QA tools
        run: |
          npm install --no-save playwright@1.55.0 http-server@14.1.1
          npx playwright install --with-deps chromium
      - name: Start local app server
        run: |
          npx http-server . -p 4173 -c-1 > /tmp/family-learning-hub-server.log 2>&1 &
          for i in {1..20}; do
            curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/family-learning-hub-server.log
          exit 1
      - name: Run isolation browser regression
        env:
          APP_URL: http://127.0.0.1:4173/
        run: node tests/qa-isolation-browser.mjs
      - name: Run mobile browser smoke test
        env:
          APP_URL: http://127.0.0.1:4173/
        run: node tests/smoke.mjs
      - name: Run math direction browser regression
        env:
          APP_URL: http://127.0.0.1:4173/
        run: node tests/math-direction-browser.mjs
      - name: Run content direction browser regression
        env:
          APP_URL: http://127.0.0.1:4173/
        run: node tests/content-direction-browser.mjs
      - name: Verify authoritative learner journey actions
        env:
          APP_URL: http://127.0.0.1:4173/
        run: node tests/learner-journey-browser.mjs
      - name: Verify learner timers and submitted mistake review
        env:
          APP_URL: http://127.0.0.1:4173/
        run: node tests/learner-timers-review-browser.mjs
      - name: Run family rewards browser regression
        env:
          APP_URL: http://127.0.0.1:4173/
        run: node tests/family-rewards-browser.mjs
      - name: Run optional Learning video browser regression
        env:
          APP_URL: http://127.0.0.1:4173/
        run: node tests/optional-learning-video-browser.mjs
      - name: Capture Playwright screenshot evidence
        env:
          APP_URL: http://127.0.0.1:4173/
        run: node tests/screenshot-evidence.mjs
      - name: Run performance regression smoke
        env:
          APP_URL: http://127.0.0.1:4173/
          PERF_SAVE_DELAY_MS: '2500'
        run: node tests/performance.mjs
      - name: Run parent dashboard prefetch performance regression
        env:
          APP_URL: http://127.0.0.1:4173/
          PARENT_DASHBOARD_DELAY_MS: '1500'
          PARENT_SUMMARY_DELAY_MS: '2500'
          PARENT_SUMMARY_VISIBLE_LIMIT_MS: '3200'
        run: node tests/parent-prefetch-performance.mjs
      - name: Append performance summary
        run: |
          for summary_file in performance-summary.md parent-prefetch-performance-summary.md; do
            if test -f "$summary_file"; then
              cat "$summary_file" >> "$GITHUB_STEP_SUMMARY"
            else
              printf '%s\n' "Summary not produced: $summary_file" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
      - name: Upload performance report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: performance-report
          path: |
            smoke-debug.json
            performance-report.json
            performance-summary.md
            parent-prefetch-performance-report.json
            parent-prefetch-performance-summary.md
          if-no-files-found: ignore
      - name: Run rendered Arabic copy QA
        env:
          APP_URL: http://127.0.0.1:4173/
        run: node tests/copy-smoke.mjs
      - name: Upload Playwright screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-screenshots-${{ github.run_id }}
          path: playwright-screenshots/
          retention-days: 7
          if-no-files-found: warn
