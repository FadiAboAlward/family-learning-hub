name: PR Public Preview

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  preview:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production main
        uses: actions/checkout@v4
        with:
          ref: main
          path: site

      - name: Checkout PR version
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: preview-src

      - name: Add PR preview without changing production root
        run: |
          PREVIEW_DIR="site/previews/pr-${{ github.event.number }}"
          rm -rf "$PREVIEW_DIR"
          mkdir -p "$PREVIEW_DIR"
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='supabase' \
            --exclude='tests' \
            preview-src/ "$PREVIEW_DIR"/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload combined production + preview artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy preview to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
