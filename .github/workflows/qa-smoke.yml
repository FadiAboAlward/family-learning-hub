name: QA Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qa-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  static-quality:
    name: Static quality
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax checks
        run: |
          find . -maxdepth 1 -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          find tests -type f -name '*.mjs' -print0 | xargs -0 -n1 node --check
      - name: Static product QA
        run: node tests/static-qa.mjs

  browser-smoke:
    name: Browser smoke
    needs: static-quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser QA tools
        run: |
          npm install --no-save playwright@1.55.0 http-server@14.1.1
          npx playwright install --with-deps chromium
      - name: Start local app server
        run: |
          npx http-server . -p 4173 -c-1 > /tmp/family-learning-hub-server.log 2>&1 &
          for i in {1..20}; do
            curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/family-learning-hub-server.log
          exit 1
      - name: Run mobile browser smoke test
        env:
          APP_URL: http://127.0.0.1:4173/
        run: node tests/smoke.mjs
      - name: Run performance regression smoke
        env:
          APP_URL: http://127.0.0.1:4173/
          PERF_SAVE_DELAY_MS: '2500'
        run: |
          node tests/performance.mjs
          cat performance-summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload performance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-report
          path: |
            performance-report.json
            performance-summary.md
          if-no-files-found: ignore
      - name: Probe deployed live frontend performance
        if: github.head_ref == 'performance-gate-v1' || github.event_name == 'workflow_dispatch'
        env:
          APP_URL: https://fadiaboalward.github.io/family-learning-hub/
          PERF_SAVE_DELAY_MS: '2500'
          PERF_APP_READY_LIMIT_MS: '5000'
          PERF_EXAM_OPEN_LIMIT_MS: '1200'
        run: |
          node tests/performance.mjs
          mv performance-report.json live-performance-report.json
          mv performance-summary.md live-performance-summary.md
          cat live-performance-summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload live performance report
        if: always() && (github.head_ref == 'performance-gate-v1' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@v4
        with:
          name: live-performance-report
          path: |
            live-performance-report.json
            live-performance-summary.md
          if-no-files-found: ignore
      - name: Run rendered Arabic copy QA
        env:
          APP_URL: http://127.0.0.1:4173/
        run: node tests/copy-smoke.mjs
