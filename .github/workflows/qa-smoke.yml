name: QA Smoke

on:
  push:
    branches: [main]
    paths:
      - '**/*.html'
      - '**/*.js'
      - '**/*.css'
      - 'tests/**'
      - '.github/workflows/qa-smoke.yml'
  pull_request:
    branches: [main]
    paths:
      - '**/*.html'
      - '**/*.js'
      - '**/*.css'
      - 'tests/**'
      - '.github/workflows/qa-smoke.yml'
  workflow_dispatch:

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser QA tools
        run: |
          npm install --no-save playwright@1.55.0 http-server@14.1.1
          npx playwright install --with-deps chromium
      - name: Start local app server
        run: |
          npx http-server . -p 4173 -c-1 > /tmp/family-learning-hub-server.log 2>&1 &
          for i in {1..20}; do
            curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/family-learning-hub-server.log
          exit 1
      - name: Run browser smoke test
        env:
          APP_URL: http://127.0.0.1:4173/
        run: node tests/smoke.mjs
